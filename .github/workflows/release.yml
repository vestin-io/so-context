name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z). Defaults to Cargo.toml version."
        required: false
        default: ""
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-version:
    name: resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.version.outputs.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            draft="false"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            draft="${{ inputs.draft }}"
          else
            version="$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -n 1)"
            draft="${{ inputs.draft }}"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not resolve release version" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          asset="so-context-${{ matrix.target }}"
          pkg_dir="dist/${asset}"
          mkdir -p "$pkg_dir"
          cp "target/${{ matrix.target }}/release/so-context" "$pkg_dir/so-context"
          cp README.md "$pkg_dir/README.md"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - build

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: so-context v${{ needs.resolve-version.outputs.version }}
          draft: ${{ needs.resolve-version.outputs.draft == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt

  update-homebrew-tap:
    name: update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - publish
    if: ${{ needs.resolve-version.outputs.draft != 'true' }}

    steps:
      - name: Check tap token availability
        id: tap-token
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap sync."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap repository
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: vestin-io/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          formula="homebrew-tap/Formula/so-context.rb"

          ruby <<'RUBY'
          formula = ENV.fetch("formula", nil) || "homebrew-tap/Formula/so-context.rb"
          tag = ENV.fetch("RELEASE_TAG")
          revision = ENV.fetch("RELEASE_REVISION")

          content = File.read(formula)
          content = content.sub(/tag: \"[^\"]+\"/, %{tag: "#{tag}"})
          content = content.sub(/revision: \"[0-9a-f]+\"/, %{revision: "#{revision}"})
          File.write(formula, content)
          RUBY

      - name: Commit and push tap update
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No tap changes to commit"
            exit 0
          fi

          git add Formula/so-context.rb
          git commit -m "Update so-context to ${RELEASE_TAG}"
          git push origin HEAD:main
