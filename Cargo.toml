[package]
name = "so-context"
version = "0.0.10"
edition = "2024"
description = "Context management layer for AI agents"
license = "MIT"
homepage = "https://github.com/vestin-io/so-context"
repository = "https://github.com/vestin-io/so-context"
readme = "README.md"
keywords = ["mcp", "agent", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rmcp = { version = "1.7.0", default-features = false, features = [
  "server",
  "transport-io",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.22"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "process"] }
tiktoken-rs = "0.11.0"
tree-sitter = "0.26"
tree-sitter-language-pack = "1.8.0"
notify = "8.2"
regex = "1.12"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
ignore = "0.4.26"
