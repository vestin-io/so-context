[package]
name = "so-context"
version = "0.1.0"
edition = "2024"
description = "A Rust project"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false }
clap = { version = "4.5", features = ["derive"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rmcp = { version = "1.7.0", default-features = false, features = [
  "server",
  "client",
  "transport-io",
  "transport-streamable-http-server",
  "transport-streamable-http-client-unix-socket",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.22"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "process"] }
tokio-util = "0.7"
tower-service = "0.3"
tree-sitter = "0.26"
tree-sitter-language-pack = "1.8.0"
walkdir = "2.5"
notify = "8.2"
url = "2.5.8"
