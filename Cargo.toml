[package]
name = "so-context"
version = "0.1.0"
edition = "2024"
description = "A Rust project"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "1.7.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
